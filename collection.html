<script>
(function () {
  "use strict";
  var H = window.CCR_ROW_HELPERS;
  var id = new URLSearchParams(location.search).get("c") || "tracks";
  var ds = null;
  (window.CCR_DS || []).forEach(function (d) { if (d.id === id) ds = d; });
  var rowsEl = document.getElementById("cRows"),
      countEl = document.getElementById("cCount"),
      qEl = document.getElementById("cQ");
  function fr() { return document.documentElement.lang === "fr"; }
  if (!ds) {
    document.getElementById("cTitle").textContent = "Unknown collection";
    document.getElementById("cLede").textContent = "Pick one from the master search.";
    return;
  }
  document.title = (fr() ? ds.fr : ds.en) + " | CanCon Radio";
  document.getElementById("cTitle").textContent = fr() ? ds.fr : ds.en;
  document.getElementById("cEyebrow").textContent = (fr() ? "COLLECTION · " : "COLLECTION · ").toUpperCase() + (fr() ? "RECHERCHE DÉDIÉE" : "DEDICATED SEARCH");

  var manifest = null;
  var rows = {};
  var pending = {};
  var fullLoad = false;   /* whole dataset preloaded: allow empty-query browsing */
  var facetsOn = {};      /* facetKey -> chosen value (null = all) */
  function loadShard(dsid, letter) {
    pending[dsid] = pending[dsid] || {};
    if (pending[dsid][letter]) return pending[dsid][letter];
    var parts = manifest && manifest.datasets && manifest.datasets[dsid]
      && manifest.datasets[dsid].parts && manifest.datasets[dsid].parts[letter];
    var files = [letter + ".json"];
    for (var i = 1; i < (parts || 1); i++) files.push(letter + "." + i + ".json");
    pending[dsid][letter] = Promise.all(files.map(function (f) {
      return fetch(window.DATA_API + "/api/data/search/" + dsid + "/" + f)
        .then(function (r) { return r.ok ? r.json() : []; })
        .catch(function () { return []; });
    })).then(function (chunks) {
      rows[dsid] = rows[dsid] || {};
      rows[dsid][letter] = chunks.reduce(function (a, c) { return a.concat(c); }, []);
      return rows[dsid][letter];
    });
    return pending[dsid][letter];
  }
  function allRows() {
    var byL = rows[ds.id] || {}, out = [];
    Object.keys(byL).forEach(function (l) { out = out.concat(byL[l]); });
    return out;
  }
  function normName(s) { return String(s || "").toLowerCase(); }
  function facetOk(r) {
    for (var k in facetsOn) {
      if (!facetsOn[k]) continue;
      if (String(r[k] == null ? "" : r[k]) !== facetsOn[k]) return false;
    }
    return true;
  }
  function matches(qn) {
    var toks = qn.split(/\s+/).filter(Boolean);
    return allRows().filter(function (r) {
      if (!facetOk(r)) return false;
      if (!toks.length) return true;
      var hay = normName(ds.fields(r).filter(Boolean).join("  "));
      return toks.every(function (x) { return hay.indexOf(x) !== -1; });
    });
  }
  /* facet chips: top values per configured field, from the loaded rows */
  function buildFacets() {
    var box = document.getElementById("cFacets");
    box.innerHTML = "";
    if (!ds.facets || !ds.facets.length) return;
    var data = allRows();
    ds.facets.forEach(function (f) {
      var counts = {};
      data.forEach(function (r) {
        var v = r[f.key];
        if (v == null || v === "") return;
        v = String(v);
        counts[v] = (counts[v] || 0) + 1;
      });
      var top = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).slice(0, 8);
      if (top.length < 2) return;
      var lab = document.createElement("span");
      lab.className = "facet-lab";
      lab.textContent = (fr() ? f.fr : f.en) + ":";
      box.appendChild(lab);
      top.forEach(function (v) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "fchip" + (facetsOn[f.key] === v ? " on" : "");
        var shown = (window.CCR_ROW_HELPERS && CCR_ROW_HELPERS.awardLong) ? CCR_ROW_HELPERS.awardLong(v) : v;
        b.textContent = shown.length > 22 ? shown.slice(0, 21) + "…" : shown;
        b.title = shown + " (" + counts[v].toLocaleString("en-CA") + ")";
        b.addEventListener("click", function () {
          facetsOn[f.key] = facetsOn[f.key] === v ? null : v;
          buildFacets(); run();
        });
        box.appendChild(b);
      });
    });
    var anyOn = Object.keys(facetsOn).some(function (k) { return facetsOn[k]; });
    if (anyOn) {
      var clr = document.createElement("button");
      clr.type = "button";
      clr.className = "fclear";
      clr.textContent = fr() ? "tout effacer" : "clear filters";
      clr.addEventListener("click", function () { facetsOn = {}; buildFacets(); run(); });
      box.appendChild(clr);
    }
  }
  var deb = null, currentQ = "";
  function renderFound(found, q) {
    countEl.textContent = found.length.toLocaleString(fr() ? "fr-CA" : "en-CA")
      + (fr() ? " résultats" : " results")
      + (q ? "" : (fr() ? " — les 120 premiers ci-dessous. Tapez pour filtrer." : " — first 120 below. Type to filter."));
    rowsEl.innerHTML = "";
    found.slice(0, 120).forEach(function (r) {
      var li = document.createElement("li");
      ds.row(r, li);
      if (window.CCR_ROW_HELPERS && CCR_ROW_HELPERS.attachDetail) CCR_ROW_HELPERS.attachDetail(r, li);
      rowsEl.appendChild(li);
    });
  }
  function run() {
    var q = qEl.value.trim();
    currentQ = q;
    if (normName(q).replace(/[^a-z0-9]/g, "").length < 2) {
      /* empty query: browse the first page when the whole collection is
         loaded; the giant title-keyed sets still require a query */
      if (fullLoad && allRows().length) renderFound(matches(""), q);
      else { rowsEl.innerHTML = ""; countEl.textContent = ""; }
      return;
    }
    if (!manifest) { manifestPromise.then(run); return; }
    var have = manifest.datasets[ds.id] || {};
    /* big artist-keyed datasets cannot resolve a title query to a shard
       letter, so anything under 120K rows loads whole; title-keyed monsters
       (tracks, albums) stay query-letter */
    var letters = fullLoad && have.letters ? have.letters
      : [normName(q).charAt(0)].filter(function (c) { return /^[a-z]$/.test(c); }).concat(["_other"]);
    Promise.all(letters.map(function (l) {
      if (have.letters && have.letters.indexOf(l) === -1) return null;
      return loadShard(ds.id, l);
    })).then(function () {
      if (qEl.value.trim() !== currentQ) return;
      renderFound(matches(normName(q)), q);
    });
  }
  qEl.addEventListener("input", function () { clearTimeout(deb); deb = setTimeout(run, 200); });
  var langBtn = document.querySelector("[data-lang-toggle]");
  if (langBtn) langBtn.addEventListener("click", function () {
    setTimeout(function () {
      var have = (manifest && manifest.datasets[ds.id]) || {};
      var n = have.rows || 0;
      document.getElementById("cLede").innerHTML = "<b style=\"color:var(--cream)\">" +
        n.toLocaleString(fr() ? "fr-CA" : "en-CA") + "</b>" +
        (fr() ? " fiches dans cette collection" : " records in this collection");
      var desc = document.getElementById("cDesc");
      if (desc) desc.textContent = fr() ? (ds.descFr || "") : (ds.descEn || "");
      buildFacets(); run();
    }, 0);
  });

  /* load the artist slug map, then re-render so names become links */
  if (window.CCR_ROW_HELPERS && CCR_ROW_HELPERS.loadSlugs) {
    CCR_ROW_HELPERS.loadSlugs(function () { run(); });
  }

  /* preload count + first page: load every shard for small collections,
     query-driven for big ones */
  var manifestPromise = fetch(window.DATA_API + "/api/data/search/manifest.json")
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (m) {
      manifest = m || { datasets: {} };
      var have = manifest.datasets[ds.id] || {};
      var n = have.rows || 0;
      var desc = document.getElementById("cDesc");
      if (desc) desc.textContent = fr() ? (ds.descFr || "") : (ds.descEn || "");
      document.getElementById("cLede").innerHTML = "<b style=\"color:var(--cream)\">" +
        n.toLocaleString(fr() ? "fr-CA" : "en-CA") + "</b>" +
        (fr() ? " fiches dans cette collection" : " records in this collection");
      fullLoad = !!(ds.all || n < 120000) && !!(have.letters || []).length;
      var letters = fullLoad ? have.letters : [];
      countEl.textContent = (fr() ? "Chargement de la collection…" : "Loading the collection…");
      return Promise.all(letters.map(function (l) { return loadShard(ds.id, l); }));
    })
    .then(function () { buildFacets(); run(); })
    .catch(function () { });
})();
</script>
